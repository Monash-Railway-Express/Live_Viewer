<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Live Feed - Serial</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="serial.js"></script>
        <link rel="manifest" href="manifest.json">
        <link rel="icon" type="image/png" href="192.png">
    </head>
    <body>
        <fieldset>
            <legend>Information</legend>
            <div>Version 2.2.0</div>
            <div>Ensure that you are on the MREx CAN Logger Wi-Fi, password YesWeCAN.</div>
        </fieldset>
        <fieldset id="connections">
            <legend>Serial Connections</legend>
            <input type="button" id="connect" value="Reconnect" disabled>
            <input type="button" id="disconnect" value="Disconnect">
            &#128128; Disconnected/error &#10024; Attempting to connect... &#9889; Connected
        </fieldset>
        <fieldset>
            <legend>Feed</legend>
            <input type="button" id="autoscroll" value="Jump">
            <input type="button" id="clear" value="Clear">
            <div id="log"></div>
        </fieldset>
    </body>
</html>
