<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Live Feed - MREx CAN Logger</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <fieldset>
            <div>Ensure that you are on the MREx CAN Logger Wi-Fi, password YesWeCAN.</div>
        </fieldset>
        <fieldset>
            <legend>Server Status</legend>
            <input type="button" id="connect" value="Connect">
            <input type="text" id="wsURL" value="ws://10.0.0.1/ws">
            <span id="status">Not connected.</span>
            <span id="error"></span>
        </fieldset>
        <fieldset>
            <legend>Feed</legend>
            <button id="translate">Toggle translation</button>
            <button id="clear">Clear</button>
            <div id="log"></div>
        </fieldset>
    </body>
</html>
