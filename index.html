<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Live Feed - MREx CAN Logger</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="script.js"></script>
        <link rel="manifest" href="manifest.json">
        <link rel="icon" type="image/png" href="192.png">
    </head>
    <body>
        <fieldset>
            <legend>Information</legend>
            <div>Version 2.3.0</div>
            <div>Ensure that you are on the MREx CAN Logger Wi-Fi, password YesWeCAN.</div>
        </fieldset>
        <fieldset>
            <legend>Server Status</legend>
            <input type="button" id="connect" value="Connect" disabled>
            <input type="text" id="sseURL" value="http://10.0.0.8/events">
            <input type="button" id="disconnect" value="Disconnect">
            <span id="status">Not connected.</span>
            <span id="error"></span>
        </fieldset>
        <fieldset>
            <legend>CAN Heartbeat Status</legend>
            &#128128; Heartbeat lost &#9889; Detecting heartbeat
            <div id="heartbeats"></div>
        </fieldset>
        <div id="connections">
            <fieldset>
                <legend>Feed</legend>
                <div>
                    <input type="button" id="autoscroll" value="Jump">
                    <input type="button" id="translate" value="Toggle translation">
                    <input type="button" id="clear" value="Clear">
                </div>
                <div id="log" class="log"></div>
            </fieldset>
        </div>
    </body>
</html>
